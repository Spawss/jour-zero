<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jour Zéro</title>
</head>
<style>
    body {
        background-color: #F1EDE1;
        color: #23261E;
        font-family: Georgia, serif;
        text-align: center;
        padding-top: 60px;
    }

    #compteur {
        color: #8A6A24;
        font-size: 48px;
        font-weight: bold;
    }
</style>
<body>
    <h1>Jour Zéro</h1>
<p>Jours sans consommation : <span id="compteur">0</span></p>
<div>
    <label for="dateArretInput">Ma date d'arrêt :</label>
    <input type="date" id="dateArretInput">
    <button id="btnValider">Valider</button>
</div>
<div>
    <label for="depenseInput">Dépense habituelle par semaine (CHF) :</label>
    <input type="number" id="depenseInput" min="0" step="0.5">
    <button id="btnDepense">Enregistrer</button>
</div>

<p>Argent économisé : <span id="argentEconomise">0</span> CHF</p>
<button id="btnEcart">Consommation déclarée</button>
<p>Nombre d'écarts déclarés : <span id="compteurEcarts">0</span></p>
<script>
    function afficherArgent(jours) {
        const depenseParSemaine = parseFloat(localStorage.getItem("depenseParSemaine")) || 0;
        const depenseParJour = depenseParSemaine / 7;
        const argent = jours * depenseParJour;

        document.getElementById("argentEconomise").textContent = argent.toFixed(2);
    }

    function afficherEcarts() {
        const historique = JSON.parse(localStorage.getItem("historiqueEcarts")) || [];
        document.getElementById("compteurEcarts").textContent = historique.length;
    }

    function afficherJours(date) {
        const aujourdhui = new Date();
        const differenceMs = aujourdhui - date;
        const jours = Math.floor(differenceMs / (1000 * 60 * 60 * 24));

        document.getElementById("compteur").textContent = jours;
        afficherArgent(jours);
    }

    const dateSauvegardee = localStorage.getItem("dateArret");

    if (dateSauvegardee) {
        afficherJours(new Date(dateSauvegardee));
    }

    afficherEcarts();

    document.getElementById("btnValider").addEventListener("click", function () {
        const valeurInput = document.getElementById("dateArretInput").value;
        const nouvelleDate = new Date(valeurInput);
        const aujourdhui = new Date();

        if (nouvelleDate > aujourdhui) {
            alert("La date d'arrêt ne peut pas être dans le futur.");
            return;
        }

        localStorage.setItem("dateArret", valeurInput);
        afficherJours(nouvelleDate);
    });

    document.getElementById("btnDepense").addEventListener("click", function () {
        const valeurDepense = document.getElementById("depenseInput").value;
        localStorage.setItem("depenseParSemaine", valeurDepense);

        const dateSauvegardee = localStorage.getItem("dateArret");
        if (dateSauvegardee) {
            afficherJours(new Date(dateSauvegardee));
        }
    });

    document.getElementById("btnEcart").addEventListener("click", function () {
        const confirmation = confirm("Confirmer une consommation ? Le compteur de jours va repartir à zéro.");

        if (!confirmation) {
            return;
        }

        const historique = JSON.parse(localStorage.getItem("historiqueEcarts")) || [];
        const aujourdhui = new Date();

        historique.push(aujourdhui.toISOString());
        localStorage.setItem("historiqueEcarts", JSON.stringify(historique));

        const nouvelleDateArret = aujourdhui.toISOString().split("T")[0];
        localStorage.setItem("dateArret", nouvelleDateArret);

        afficherJours(aujourdhui);
        afficherEcarts();
    });
</script>
</body>
</html>
