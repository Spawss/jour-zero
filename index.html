<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jour Zéro</title>
         <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Spectral:wght@500;600&display=swap">
</head>
<style>   
    body {
        background-color: #0D1310;
        color: #FFFFFF;
        font-family: 'Manrope', system-ui, sans-serif;
        text-align: center;
        padding: 30px 20px 60px;
    }

        h1, h2 {
        font-family: 'Spectral', Georgia, serif;
        font-weight: 600;
    }

    #compteur {
        font-family: 'Spectral', Georgia, serif;
        color: #FFFFFF;
        font-size: 56px;
        font-weight: 600;
    }

    .jour-case {
    width: 16px;
    height: 16px;
    display: inline-block;
    margin: 2px;
    border-radius: 3px;

}

#accueilOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

#accueilBoite {
    background-color: #152019;
    color: #FFFFFF;
    padding: 30px;
    border-radius: 8px;
    max-width: 400px;
    text-align: left;
}

#accueilBoite label {
    display: block;
    margin-top: 15px;
}

#accueilBoite select,
#accueilBoite input {
    width: 100%;
    margin-top: 5px;
    padding: 5px;
}

#accueilBoite input[type="checkbox"] {
    width: auto;
    margin-top: 0;
    margin-right: 8px;
}

#accueilBoite label.checkboxLabel {
    display: flex;
    align-items: center;
    font-weight: normal;
}

#logo {
    letter-spacing: 1px;
    margin-bottom: 4px;
}

#logoJour {
    color: #FFFFFF;
}

#logoZero {
    color: #F0883E;
}

#tagline {
    font-size: 13px;
    color: #8FA396;
    margin-top: 0;
    margin-bottom: 30px;
}

</style>
<body>
    <h1 id="logo"><span id="logoJour">Jour</span> <span id="logoZero">Zéro</span></h1>
<p id="tagline">Ton suivi, jour après jour.</p>
<p>Jours sans consommation : <span id="compteur">0</span></p>
<div>
    <label for="dateArretInput">Ma date d'arrêt :</label>
    <input type="date" id="dateArretInput">
    <button id="btnValider">Valider</button>
</div>
<div>
    <label for="depenseInput">Dépense habituelle par semaine (CHF) :</label>
    <input type="number" id="depenseInput" min="0" step="0.5">
    <button id="btnDepense">Enregistrer</button>
</div>

<p>Argent économisé : <span id="argentEconomise">0</span> CHF</p>
<button id="btnEcart">J'ai craqué</button>
<p>Nombre de fois où j'ai craqué : <span id="compteurEcarts">0</span></p>
<button id="btnEnvie">Résister à l'envie</button>
<p>Envies résistées : <span id="compteurEnvies">0</span></p>
<h2>Carnet de suivi</h2>
<div id="carnet"></div>
<div id="accueilOverlay">
    <div id="accueilBoite">
        <h2>Bienvenue sur Jour Zéro</h2>
        <p>Quelques questions pour personnaliser ton suivi.</p>

        <label for="prenomInput">Ton prénom (facultatif) :</label>
        <input type="text" id="prenomInput" placeholder="Comment on t'appelle ?">

        <label for="motivationInput">Ta motivation principale :</label>
        <select id="motivationInput">
            <option value="permis">Récupérer mon permis</option>
            <option value="sante">Ma santé</option>
            <option value="argent">L'argent</option>
            <option value="sommeil">Mieux dormir</option>
            <option value="autre">Autre raison</option>
        </select>

        <label class="checkboxLabel">
            <input type="checkbox" id="pasDObjectifInput">
            J'arrête complètement, pas de date de fin
        </label>

        <div id="objectifBloc">
            <label for="objectifInput">Mon objectif :</label>
            <input type="number" id="objectifInput" min="1" value="30">
            <select id="objectifUniteInput">
                <option value="jours">jour(s)</option>
                <option value="semaines">semaine(s)</option>
                <option value="mois">mois</option>
                <option value="annees">année(s)</option>
            </select>
        </div>

        <button id="btnCreerCompte">Créer mon compte</button>
    </div>
</div>
<script>

    function afficherAccueilSiBesoin() {
    const compteCree = localStorage.getItem("compteCree");
    const overlay = document.getElementById("accueilOverlay");

    if (compteCree) {
        overlay.style.display = "none";
    } else {
        overlay.style.display = "flex";
    }
    }

afficherAccueilSiBesoin();

    function afficherEnvies() {
    const historiqueEnvies = JSON.parse(localStorage.getItem("historiqueEnvies")) || [];
    document.getElementById("compteurEnvies").textContent = historiqueEnvies.length;
    } 

    function afficherCarnet() {
    const conteneur = document.getElementById("carnet");
    conteneur.innerHTML = "";

    const historiqueEcarts = JSON.parse(localStorage.getItem("historiqueEcarts")) || [];
    const joursEcarts = historiqueEcarts.map(function (date) {
        return date.split("T")[0];
    });

    const nombreDeJours = 30;
    const aujourdhui = new Date();

    for (let i = nombreDeJours - 1; i >= 0; i--) {
        const jour = new Date(aujourdhui);
        jour.setDate(jour.getDate() - i);
        const jourTexte = jour.toISOString().split("T")[0];

        const carre = document.createElement("div");
        carre.classList.add("jour-case");
        carre.title = jourTexte;

        if (joursEcarts.includes(jourTexte)) {
    carre.style.backgroundColor = "#A85A3B";
} else {
    carre.style.backgroundColor = "#2F7D52";
}

        conteneur.appendChild(carre);
    }
    }
 
    function afficherArgent(jours) {
        const depenseParSemaine = parseFloat(localStorage.getItem("depenseParSemaine")) || 0;
        const depenseParJour = depenseParSemaine / 7;
        const argent = jours * depenseParJour;

        document.getElementById("argentEconomise").textContent = argent.toFixed(2);
    }

    function afficherEcarts() {
        const historique = JSON.parse(localStorage.getItem("historiqueEcarts")) || [];
        document.getElementById("compteurEcarts").textContent = historique.length;
    }

    function afficherJours(date) {
        const aujourdhui = new Date();
        const differenceMs = aujourdhui - date;
        const jours = Math.floor(differenceMs / (1000 * 60 * 60 * 24));

        document.getElementById("compteur").textContent = jours;
        afficherArgent(jours);
    }

    const dateSauvegardee = localStorage.getItem("dateArret");

    if (dateSauvegardee) {
        afficherJours(new Date(dateSauvegardee));
    }

    afficherEcarts();
    afficherCarnet();

    document.getElementById("btnEnvie").addEventListener("click", function () {
    const historiqueEnvies = JSON.parse(localStorage.getItem("historiqueEnvies")) || [];
    historiqueEnvies.push(new Date().toISOString());
    localStorage.setItem("historiqueEnvies", JSON.stringify(historiqueEnvies));
    afficherEnvies();
    });

    document.getElementById("btnValider").addEventListener("click", function () {
        const valeurInput = document.getElementById("dateArretInput").value;
        const nouvelleDate = new Date(valeurInput);
        const aujourdhui = new Date();

        if (nouvelleDate > aujourdhui) {
            alert("La date d'arrêt ne peut pas être dans le futur.");
            return;
        }

        localStorage.setItem("dateArret", valeurInput);
        afficherJours(nouvelleDate);
    });
    
    document.getElementById("pasDObjectifInput").addEventListener("change", function () {
        const blocObjectif = document.getElementById("objectifBloc");

        if (this.checked) {
            blocObjectif.style.display = "none";
        } else {
            blocObjectif.style.display = "block";
        }
    });

    document.getElementById("btnCreerCompte").addEventListener("click", function () {
    const prenom = document.getElementById("prenomInput").value;
    const motivation = document.getElementById("motivationInput").value;
    const pasDObjectif = document.getElementById("pasDObjectifInput").checked;

    localStorage.setItem("prenom", prenom);
    localStorage.setItem("motivation", motivation);
    localStorage.setItem("pasDObjectif", pasDObjectif);

    if (!pasDObjectif) {
        const nombre = parseFloat(document.getElementById("objectifInput").value) || 1;
        const unite = document.getElementById("objectifUniteInput").value;

        let jours = nombre;
        if (unite === "semaines") jours = nombre * 7;
        if (unite === "mois") jours = nombre * 30;
        if (unite === "annees") jours = nombre * 365;

        localStorage.setItem("objectifJours", jours);
    } else {
        localStorage.removeItem("objectifJours");
    }

    localStorage.setItem("compteCree", "oui");

    document.getElementById("accueilOverlay").style.display = "none";
    });

    document.getElementById("btnDepense").addEventListener("click", function () {
        const valeurDepense = document.getElementById("depenseInput").value;
        localStorage.setItem("depenseParSemaine", valeurDepense);

        const dateSauvegardee = localStorage.getItem("dateArret");
        if (dateSauvegardee) {
            afficherJours(new Date(dateSauvegardee));
        }
    });

    document.getElementById("btnEcart").addEventListener("click", function () {
        const confirmation = confirm("Confirmer une consommation ? Le compteur de jours va repartir à zéro.");

        if (!confirmation) {
            return;
        }

        const historique = JSON.parse(localStorage.getItem("historiqueEcarts")) || [];
        const aujourdhui = new Date();

        historique.push(aujourdhui.toISOString());
        localStorage.setItem("historiqueEcarts", JSON.stringify(historique));

        const nouvelleDateArret = aujourdhui.toISOString().split("T")[0];
        localStorage.setItem("dateArret", nouvelleDateArret);

        afficherJours(aujourdhui);
        afficherEcarts();
        afficherCarnet();
    });
</script>
</body>
</html>
